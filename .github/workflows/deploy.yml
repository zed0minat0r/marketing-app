name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      # Publish ONLY the public site files. The repo root also holds
      # admin.html, schema.sql, .env.example, and internal docs - none of
      # which belong on a public site.
      - name: Stage public site files
        run: |
          mkdir -p _site/docs
          # privacy.html and terms.html are GENERATED (scripts/build_policy_pages.py) and MUST
          # ship: Meta App Review needs a privacy policy URL that resolves, and this allowlist
          # is why it did not. data-deletion-status.html is deliberately absent here - Meta's
          # callback points at the Vercel host, which serves the repo root directly.
          cp index.html connected.html privacy.html terms.html robots.txt sitemap.xml og.png _site/
          cp docs/optin-proof.png _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
